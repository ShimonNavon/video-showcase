# Static showcase. Public entry is Cloudflare -> ubuntu01 edge nginx -> this pod.
# HTML comes from a ConfigMap; clips live on the PVC mounted at /media.
limit_req_zone $binary_remote_addr zone=site_flood:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=site_conn:10m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 1m;
    client_body_timeout 10s;

    # Read-only site: nothing legitimately posts, uploads or deletes.
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    limit_req zone=site_flood burst=200 nodelay;
    limit_req_status 429;
    limit_conn site_conn 60;
    limit_conn_status 429;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; media-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    location ~ /\. { return 404; }
    location ~* \.(?:env|git|sql|bak|log|ini|conf|map)$ { return 404; }

    # Clips and posters: immutable file names, so cache hard. Range requests work out of the box.
    location /media/ {
        alias /media/;
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; media-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri.html $uri/ =404;
    }
}
