<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #0a0a0c; }
      #root { position: relative; width: 100%; height: 100%; }
      #root > video { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; }
      #v-edit { clip-path: inset(0 0 0 100%); }
    </style>
  </head>
  <body>
    <!-- LinkedIn cut, 9:16: one shot per 2-4 beats of the 120 BPM track, the fisherman's own line as the payoff. -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="25.0" data-width="1080" data-height="1920">
      <video id="v-hero" class="clip" src="assets/hero.mp4" muted playsinline data-start="0.0" data-duration="2.30" data-media-start="0.4" data-track-index="1" style="z-index:1;object-position:56% 50%"></video>
      <video id="v-t2v-desert" class="clip" src="assets/t2v-desert.mp4" muted playsinline data-start="2.3" data-duration="2.00" data-media-start="0.8" data-track-index="2" style="z-index:2;object-position:20% 50%"></video>
      <video id="v-t2v-clay" class="clip" src="assets/t2v-clay.mp4" muted playsinline data-start="4.3" data-duration="1.50" data-media-start="1.0" data-track-index="3" style="z-index:3;object-position:50% 50%"></video>
      <video id="v-t2v-ocean" class="clip" src="assets/t2v-ocean.mp4" muted playsinline data-start="5.8" data-duration="1.50" data-media-start="1.0" data-track-index="4" style="z-index:4;object-position:45% 50%"></video>
      <video id="v-i2v" class="clip" src="assets/i2v.mp4" muted playsinline data-start="7.3" data-duration="2.00" data-media-start="1.0" data-track-index="5" style="z-index:5;object-position:62% 50%"></video>
      <video id="v-frames" class="clip" src="assets/frames.mp4" muted playsinline data-start="9.3" data-duration="2.00" data-media-start="1.8" data-track-index="6" style="z-index:6;object-position:50% 50%"></video>
      <video id="v-char-1" class="clip" src="assets/char-1.mp4" muted playsinline data-start="11.3" data-duration="1.50" data-media-start="0.8" data-track-index="7" style="z-index:7;object-position:30% 50%"></video>
      <video id="v-char-2" class="clip" src="assets/char-2.mp4" muted playsinline data-start="12.8" data-duration="1.50" data-media-start="0.8" data-track-index="8" style="z-index:8;object-position:42% 50%"></video>
      <video id="v-edit-src" class="clip" src="assets/t2v-desert.mp4" muted playsinline data-start="14.3" data-duration="2.00" data-media-start="1.5" data-track-index="9" style="z-index:9;object-position:26% 50%"></video>
      <video id="v-edit" class="clip" src="assets/edit.mp4" muted playsinline data-start="14.3" data-duration="2.00" data-media-start="1.5" data-track-index="10" style="z-index:10;object-position:26% 50%"></video>
      <video id="v-motion" class="clip" src="assets/motion.mp4" muted playsinline data-start="16.3" data-duration="2.00" data-media-start="0.8" data-track-index="11" style="z-index:11;object-position:42% 50%"></video>
      <video id="v-fish" class="clip" src="assets/audio.mp4" playsinline data-has-audio="true" data-volume="1.4" data-start="18.3" data-duration="4.30" data-media-start="0" data-track-index="12" style="z-index:12;object-position:55% 50%"></video>
      <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html" data-track-kind="graphics" data-start="0" data-duration="25.0" data-track-index="40" data-width="1080" data-height="1920" style="z-index:40"></div>
      <audio id="music-a" class="clip" src="assets/music.mp3" data-start="0" data-duration="18.3" data-volume="1" data-track-index="41"></audio>
      <audio id="music-b" class="clip" src="assets/music.mp3" data-start="18.3" data-duration="4.30" data-media-start="18.3" data-volume="0.18" data-track-index="42"></audio>
      <audio id="music-c" class="clip" src="assets/music.mp3" data-start="22.6" data-duration="2.40" data-media-start="22.6" data-volume="1" data-fade-out="1.2" data-track-index="43"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#v-edit", { clipPath: "inset(0 0 0 100%)" }, { clipPath: "inset(0 0 0 0%)", duration: 0.5, ease: "power2.inOut" }, 15.0);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
